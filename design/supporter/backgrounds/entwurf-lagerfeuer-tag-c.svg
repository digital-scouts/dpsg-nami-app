<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice"><title>lagerfeuer-tag c</title><style>

.glow { animation: flicker 5.3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 70%; }
.glow2 { animation: flicker 3.7s ease-in-out infinite alternate-reverse; transform-box: fill-box; transform-origin: 50% 70%; }
@keyframes flicker { from { opacity: .55; transform: scale(1); } to { opacity: .85; transform: scale(1.06); } }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation-name: flame; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: alternate; }
@keyframes flame {
  0% { transform: scale(1, 1) skewX(0deg); }
  35% { transform: scale(.94, 1.08) skewX(-4deg); }
  70% { transform: scale(1.04, .94) skewX(3deg); }
  100% { transform: scale(.98, 1.04) skewX(-1deg); }
}
.spark { animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite; opacity: 0; }
@keyframes rise { 0% { transform: translate(0,0); opacity: 0; } 10% { opacity: .85; } 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.smoke { animation-name: smoke; animation-timing-function: ease-out; animation-iteration-count: infinite; opacity: 0; transform-box: fill-box; transform-origin: center; }
@keyframes smoke { 0% { transform: translate(0,0) scale(.6); opacity: 0; } 15% { opacity: .3; } 100% { transform: translate(var(--dx), var(--dy)) scale(3); opacity: 0; } }
.bird { animation-name: fly; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes fly { from { transform: translate(var(--x0), var(--y0)); } 50% { transform: translate(calc((var(--x0) + var(--x1)) / 2), calc(var(--y0) - 14px)); } to { transform: translate(var(--x1), var(--y1)); } }
.flap { animation: flap 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-0.35); } }
.mist { animation: drift 40s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(160px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
