<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Marke</title><style>
body { margin:0; font:14px system-ui, sans-serif; }
section { display:flex; align-items:center; gap:24px; padding:24px 32px; flex-wrap:wrap; }
.hell { background:#fbfaf7; color:#1c1c1e; } .dunkel { background:#15171d; color:#f0f0f5; }
.lockup { display:flex; align-items:center; gap:10px; } .lockup b { font-size:30px; letter-spacing:-.5px; }
.ebenen { display:flex; gap:8px; } .ebenen img { outline:1px dashed #8888; }
</style></head><body>
<section class="hell">
  <img src="svg/logo-hell.svg" width="160" height="160">
  <div class="lockup"><img src="svg/logo-hell.svg" width="58" height="58"><b>NaMi</b></div>
  <img src="svg/icon-hell.svg" width="120" height="120" style="border-radius:22.4%;box-shadow:0 2px 8px rgba(0,0,0,.18)"> <img src="svg/icon-hell.svg" width="60" height="60" style="border-radius:22.4%;box-shadow:0 2px 8px rgba(0,0,0,.18)"> <img src="svg/icon-hell.svg" width="29" height="29" style="border-radius:22.4%;box-shadow:0 2px 8px rgba(0,0,0,.18)">
  <span class="ebenen"><img src="svg/icon-hell-grund.svg" width="60" height="60" title="grund"><img src="svg/icon-hell-tuch.svg" width="60" height="60" title="tuch"><img src="svg/icon-hell-knoten.svg" width="60" height="60" title="knoten"></span>
</section>
<section class="dunkel">
  <img src="svg/logo-dunkel.svg" width="160" height="160">
  <div class="lockup"><img src="svg/logo-dunkel.svg" width="58" height="58"><b>NaMi</b></div>
  <img src="svg/icon-dunkel.svg" width="120" height="120" style="border-radius:22.4%;box-shadow:0 2px 8px rgba(0,0,0,.18)"> <img src="svg/icon-dunkel.svg" width="60" height="60" style="border-radius:22.4%;box-shadow:0 2px 8px rgba(0,0,0,.18)"> <img src="svg/icon-dunkel.svg" width="29" height="29" style="border-radius:22.4%;box-shadow:0 2px 8px rgba(0,0,0,.18)">
  <span class="ebenen"><img src="svg/icon-dunkel-grund.svg" width="60" height="60" title="grund"><img src="svg/icon-dunkel-tuch.svg" width="60" height="60" title="tuch"><img src="svg/icon-dunkel-knoten.svg" width="60" height="60" title="knoten"></span>
</section>
</body></html>
