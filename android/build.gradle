allprojects {
    repositories {
        google()
        mavenCentral()
    }

    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                    // Einige Plugins (z. B. objectbox_flutter_libs 4.x, durch
                    // flutter_map_tile_caching 10.x festgelegt) kompilieren noch
                    // gegen ein altes SDK; AGP 9 lehnt das bei der AAR-Pruefung ab.
                    if (compileSdk != null && compileSdk < 36) {
                        compileSdk 36
                    }
                }
            }
        }
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir('../../build').get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
