<!doctype html>
<!-- Google-Play-Vorstellungsgrafik 1024 × 500. Parameter: ?style=navy|hell|stufen -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Vorstellungsgrafik</title>
<script src="content.js"></script>
<link rel="stylesheet" href="store.css">
<style>
  .fg { width: 1024px; height: 500px; }
  .fg .left { position: absolute; left: 64px; top: 0; bottom: 0; width: 410px; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
  .fg .brand { display: flex; align-items: center; gap: 22px; }
  .fg .brand img { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.25); background: #fff; }
  .fg .brand h1 { font-size: 92px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .fg .claim { text-wrap: balance; font-size: 27px; line-height: 1.3; margin: 28px 0 0; font-weight: 500; }
  .fg .stripes { display: flex; gap: 8px; margin-top: 30px; }
  .fg .stripes span { width: 44px; height: 8px; border-radius: 4px; }
  .fg .phones { position: absolute; right: -6px; top: 40px; width: 490px; height: 700px; z-index: 1; }
  .fg .phone { position: absolute; width: 210px; background: #0d0e11; padding: 7px; border-radius: 34px; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .fg .phone img { display: block; width: 100%; border-radius: 28px; }
  .fg .phone:nth-child(1) { left: 0; top: 70px; transform: rotate(-8deg); }
  .fg .phone:nth-child(2) { left: 140px; top: 0; z-index: 2; }
  .fg .phone:nth-child(3) { left: 280px; top: 70px; transform: rotate(8deg); }
  .s-hell .claim { color: #3b4250; }
  .s-navy .claim, .s-stufen .claim { color: #d6e4f2; }
  .s-stufen { --accent: var(--navy); }
</style>
</head>
<body>
<div id="canvas" class="canvas fg"></div>
<script src="store.js"></script>
<script>
  const style = new URLSearchParams(location.search).get('style') || StoreRender.defaultStyle();
  const fg = STORE.featureGraphic;
  const canvas = document.getElementById('canvas');
  canvas.classList.add('s-' + style);
  canvas.innerHTML = `
    ${StoreRender.watermark(620, 380, -200)}
    <div class="left">
      <div class="brand"><img src="../../icon/icon.png" alt=""><h1>${fg.title}</h1></div>
      <p class="claim">${fg.claim}</p>
      <div class="stripes">
        <span style="background:var(--woe)"></span><span style="background:var(--jufi)"></span>
        <span style="background:var(--pfadi)"></span><span style="background:var(--rover)"></span>
      </div>
    </div>
    <div class="phones">
      ${fg.scenes.map((s) => `<div class="phone"><img src="raw/iphone/${s}.png${StoreRender.bust}" alt=""></div>`).join('')}
    </div>`;
</script>
</body>
</html>
