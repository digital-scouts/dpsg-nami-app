# GitHub Pages der NaMi-App: Funktionsübersicht, Nutzerhandbuch, Technik.
# Gebaut von GitHub Pages (legacy, Branch develop, Ordner /docs).
# Lokal: cd docs && bundle exec jekyll serve
#
# Die App ruft diese Adresse direkt ab, sie darf sich nicht ändern:
#   /app-privacy-policy   (lib/domain/rechtliches/anbieter.dart)
# Meldungen und Versionen liefert der Statistikserver (server/spec/app_feeds.md).

title: NaMi App
description: >-
  Die inoffizielle App zur NaMi, der Mitgliederverwaltung der DPSG:
  Mitglieder, Statistik und Stufenwechsel für Leitende, auch offline.
email: dev@jannecklange.de
lang: de
baseurl: "/dpsg-nami-app"
url: "https://digital-scouts.github.io"
github_username: JanneckLange

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-seo-tag

color_scheme: nami
search_enabled: true
search:
  heading_level: 2
  previews: 2
  button: false
heading_anchors: true
back_to_top: true
back_to_top_text: "Nach oben"
nav_sort: case_insensitive

aux_links:
  "GitHub":
    - "https://github.com/digital-scouts/dpsg-nami-app"
aux_links_new_tab: true

footer_content: >-
  Privat entwickelt. Kein offizielles Angebot der DPSG und nicht von ihr autorisiert.
  <a href="/dpsg-nami-app/impressum/">Impressum</a> ·
  <a href="/dpsg-nami-app/app-privacy-policy">Datenschutzerklärung</a>

mermaid:
  version: "11.4.1"

callouts_level: quiet
callouts:
  hinweis:
    title: Hinweis
    color: blue
  wichtig:
    title: Gut zu wissen
    color: yellow
  achtung:
    title: Achtung
    color: red

defaults:
  # Handbuch und Technik unter /bereich/seite/, damit Links mit Schrägstrich
  # auch auf GitHub Pages funktionieren.
  - scope:
      path: "handbuch"
    values:
      permalink: /handbuch/:basename/
  - scope:
      path: "technik"
    values:
      permalink: /technik/:basename/
  - scope:
      path: "_posts"
    values:
      nav_exclude: true
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - .jekyll-cache
