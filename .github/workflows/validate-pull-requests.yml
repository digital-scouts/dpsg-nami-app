name: Validate Pull Requests

on:
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Weiche auf Job-Ebene statt Workflow-paths: develop verlangt die App-Checks,
  # uebersprungene Jobs gelten als erfolgreich, nie gestartete Workflows nicht.
  # Neue App-Verzeichnisse oder -Dateien hier ergaenzen.
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' }}
      ios: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ios == 'true' }}
      versions: ${{ github.event_name != 'pull_request' || steps.filter.outputs.versions == 'true' }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - "lib/**"
              - "test/**"
              - "integration_test/**"
              - "assets/**"
              - "android/**"
              - "ios/**"
              - "tool/**"
              - "pubspec.yaml"
              - "pubspec.lock"
              - "analysis_options.yaml"
              - ".env.example"
              - ".github/workflows/validate-pull-requests.yml"
            # Dart-Fehler fangen analyze und test; der macOS-Lauf deckt Xcode ab.
            ios:
              - "ios/**"
              - "pubspec.yaml"
              - "pubspec.lock"
              - ".github/workflows/validate-pull-requests.yml"
            versions:
              - "pubspec.yaml"
              - "assets/changelog.json"
              - "docs/version.json"

  # Z. B. Version-Reminder-PRs, die nur docs/version.json aendern.
  validate-versions:
    name: Validate versions
    needs: changes
    if: needs.changes.outputs.versions == 'true' && needs.changes.outputs.app != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.2" # Dart von Flutter 3.44.5

      - name: Validate app version consistency
        run: dart tool/validate_versions.dart

  # Laeuft immer: sperrt API-Mitschnitte im Stand und in der gesamten Historie,
  # damit auch alte Branches von vor der Historienbereinigung auffallen.
  validate-tracked-files:
    name: Validate tracked files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.2" # Dart von Flutter 3.44.5

      - name: Block API captures in index and history
        run: dart tool/validate_tracked_files.dart --history

  validate:
    name: Validate Flutter project
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate app version consistency
        run: dart tool/validate_versions.dart

      - name: Validate env example syntax
        shell: bash
        run: |
          cp .env.example .env.ci
          dart tool/validate_env_files.dart .env.ci .env.example
          rm .env.ci

      - name: Create env file for analysis
        run: cp .env.example .env

      - name: Require version bump for master PRs
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:pubspec.yaml" | awk '/^version:/{print $2}')
          HEAD_VERSION=$(awk '/^version:/{print $2}' pubspec.yaml)
          BASE_RELEASE="${BASE_VERSION%%+*}"
          HEAD_RELEASE="${HEAD_VERSION%%+*}"

          python3 - "$BASE_RELEASE" "$HEAD_RELEASE" <<'PY'
          import sys

          base = tuple(int(part) for part in sys.argv[1].split('.'))
          head = tuple(int(part) for part in sys.argv[2].split('.'))

          if head <= base:
              print(f"Version bump required for master PRs: base={sys.argv[1]} head={sys.argv[2]}")
              raise SystemExit(1)
          PY

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      # Release statt Debug: R8/minify und AAB-Packaging brechen sonst erst im
      # Deploy nach dem Merge.
      - name: Build Android App Bundle (release, unsigned)
        run: flutter build appbundle --release

      - name: Verify 16 KB page size support
        run: tool/android/check_16kb_alignment.sh build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 3

  update-check-android:
    name: Update check Android
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # run_upgrade_test.sh baut die letzte Release-Version aus ihrem Tag.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Ohne Wiredash-Werte wirft main.dart; Dummy-Werte reichen.
      - name: Create env file for emulator tests
        run: |
          sed -e 's/^WIREDASH_SECRET=.*/WIREDASH_SECRET=ci-dummy/' \
              -e 's/^WIREDASH_PROJECT_ID=.*/WIREDASH_PROJECT_ID=ci-dummy/' \
              .env.example > .env

      - name: Download Android App Bundle
        uses: actions/download-artifact@v4
        with:
          name: android-release-aab
          path: ${{ runner.temp }}/aab

      - name: Download bundletool
        run: |
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Upgrade from last release and release smoke start
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # Jede Zeile laeuft in einer eigenen Shell.
          script: |
            tool/upgrade_test/run_upgrade_test.sh --platform android --device emulator-5554
            tool/android/smoke_start_release.sh --aab "${{ runner.temp }}/aab/app-release.aab" --device emulator-5554

  validate-ios:
    name: Validate iOS Swift
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create env file for build
        run: cp .env.example .env

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --project-directory=.

      - name: Verify Swift formatting
        run: |
          swift format --recursive --in-place ios
          git diff --exit-code -- ios ':!ios/Podfile.lock'

      - name: Build iOS app target
        run: |
          set -e
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
