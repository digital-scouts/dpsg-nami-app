name: Validate Server

on:
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "server/**"
      - ".github/workflows/server-validate.yml"
  workflow_dispatch:
  # Wird vom Deploy-Workflow vor dem Image-Build aufgerufen.
  workflow_call:

permissions:
  contents: read

# Nur PR-Laeufe abbrechen; beim workflow_call ist die Gruppe pro Deploy-Lauf eindeutig.
concurrency:
  group: server-validate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-server:
    name: Validate statistics server
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Cache MongoDB binary for integration tests
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package.json') }}

      - name: Install server dependencies
        run: npm ci

      - name: Typecheck server
        run: npm run typecheck

      - name: Run server tests
        run: npm run test

      - name: Build server
        run: npm run build

      - name: Build server Docker image
        run: docker build --target production -t nami-statistics-server:test .
