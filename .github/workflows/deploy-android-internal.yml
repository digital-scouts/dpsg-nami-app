name: Deploy Android Internal

on:
  push:
    branches: [develop]
    # Nur Android-relevante App-Aenderungen; docs/version.json (Version-Reminder) bewusst nicht.
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "assets/**"
      - "android/**"
      - "tool/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".env.example"
      - ".github/workflows/deploy-android-internal.yml"
  pull_request:
    branches: [master]
    types: [closed]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "assets/**"
      - "android/**"
      - "tool/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".env.example"
      - ".github/workflows/deploy-android-internal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-android-internal-${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build and deploy Android AAB
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate app version consistency
        run: dart tool/validate_versions.dart

      - name: Validate env example syntax
        shell: bash
        run: |
          cp .env.example .env.ci
          dart tool/validate_env_files.dart .env.ci .env.example
          rm .env.ci

      - name: Create env file for analysis
        run: cp .env.example .env

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Read release version from pubspec
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION=$(awk '/^version:/{print $2}' pubspec.yaml)
          RELEASE_VERSION="${FULL_VERSION%%+*}"
          # Der Vorgaenger-Workflow hat versionCodes bis 210+ belegt (0.2.x);
          # Play lehnt nicht steigende versionCodes ab.
          BUILD_NUMBER=$((100000 + ${{ github.run_number }} * 100 + ${{ github.run_attempt }}))
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "### Android build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release version: $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build number: $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Create env file
        shell: bash
        env:
          WIREDASH_SECRET: ${{ secrets.PROD_WIREDASH_SECRET }}
          WIREDASH_PROJECT_ID: ${{ secrets.PROD_WIREDASH_PROJECT_ID }}
          GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}
          HITOBITO_BASE_URL: ${{ vars.HITOBITO_BASE_URL }}
          HITOBITO_OAUTH_CLIENT_ID: ${{ vars.HITOBITO_OAUTH_CLIENT_ID }}
          HITOBITO_OAUTH_CLIENT_SECRET: ${{ secrets.HITOBITO_OAUTH_CLIENT_SECRET }}
          HITOBITO_OAUTH_REDIRECT_URI: ${{ vars.HITOBITO_OAUTH_REDIRECT_URI }}
          # Optional; ohne Repository-Variable gilt der Default aus .env.example.
          STATS_SERVER_URL: ${{ vars.STATS_SERVER_URL }}
        run: |
          set -euo pipefail
          # Wie ios/ci_scripts/ci_pre_xcodebuild.sh (require_env): diese Keys
          # kommen nur aus CI, sonst liefe der Build z. B. gegen demo.hitobito.com.
          REQUIRED_KEYS="WIREDASH_SECRET WIREDASH_PROJECT_ID GEOAPIFY_KEY HITOBITO_BASE_URL HITOBITO_OAUTH_CLIENT_ID HITOBITO_OAUTH_CLIENT_SECRET HITOBITO_OAUTH_REDIRECT_URI"
          # Uebrige Keys: CI-Wert, sonst Default aus .env.example (URLs, Limits).
          grep -E '^[A-Z][A-Z0-9_]*=' .env.example | while IFS= read -r line; do
            key="${line%%=*}"
            value="$(printenv "$key" || true)"
            if [[ " $REQUIRED_KEYS " != *" $key "* ]]; then
              value="${value:-${line#*=}}"
            fi
            printf '%s=%s\n' "$key" "$value"
          done > .env
          for key in $REQUIRED_KEYS; do
            if ! grep -Eq "^${key}=.+" .env; then
              echo "::warning::$key ist nicht gesetzt; der Build ist so nicht produktiv nutzbar."
            fi
          done
          dart tool/validate_env_files.dart

      - name: Build Android App Bundle
        run: |
          flutter build appbundle \
            --build-name "${{ steps.version.outputs.release_version }}" \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Verify 16 KB page size support
        run: tool/android/check_16kb_alignment.sh build/app/outputs/bundle/release/app-release.aab

      - name: Sign Android App Bundle
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: build/app/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE }}
          alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

      - name: Upload to Play Console Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          packageName: de.jlange.nami.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          releaseName: ${{ steps.version.outputs.release_version }}+${{ steps.version.outputs.build_number }}
          track: internal
